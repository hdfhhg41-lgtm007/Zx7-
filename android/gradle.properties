# Optimized for 4GB zero-swap containers, GitHub Actions & Android Studio
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=false
org.gradle.caching=false

# Run Kotlin compiler inside Gradle JVM (avoids separate ~1GB Kotlin daemon JVM)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
kotlin.incremental=false
kotlin.code.style=official

# Android resource & R-class memory optimizations (AGP 8.7+)
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableResourceOptimizations=true
