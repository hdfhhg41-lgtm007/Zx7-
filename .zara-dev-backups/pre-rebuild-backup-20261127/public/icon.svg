<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#240c4a"/>
      <stop offset="60%" stop-color="#120626"/>
      <stop offset="100%" stop-color="#05020d"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#ec4899" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Orbital Ring -->
  <ellipse cx="256" cy="240" rx="190" ry="55" fill="none" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.6" transform="rotate(-20 256 240)" filter="url(#neonGlow)"/>

  <!-- Glowing Heart -->
  <path d="M256 390 C256 390 120 280 120 180 C120 120 168 80 224 80 C246 80 268 92 280 110 C292 92 314 80 336 80 C392 80 440 120 440 180 C440 280 304 390 256 390 Z" 
        fill="url(#heartGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Inner Sparkle -->
  <circle cx="200" cy="150" r="14" fill="#ffffff" opacity="0.8"/>
  <circle cx="230" cy="180" r="7" fill="#ffffff" opacity="0.6"/>

  <!-- Text "ZARA" -->
  <text x="256" y="450" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="8">ZARA</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ec4899" letter-spacing="4">AI COMPANION</text>
</svg>
